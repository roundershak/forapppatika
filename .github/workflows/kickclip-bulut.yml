name: KickClip Bulut

# GitHub -> Actions -> "KickClip Bulut" -> Run workflow
# Bilgisayar gerekmez: klipler GitHub'ın bulut makinesinde üretilip doğrudan YouTube'a yüklenir.

on:
  workflow_dispatch:
    inputs:
      link:
        description: "Kick yayın (VOD) linki"
        required: true
      tur:
        description: "Ne yapılsın?"
        type: choice
        options: [shorts, uzun-video]
        default: shorts
      youtube:
        description: "YouTube'a yükleme"
        type: choice
        options: [ozel-yukle, liste-disi-yukle, herkese-acik-yukle, yukleme]
        default: ozel-yukle
      adet:
        description: "Shorts: klip sayısı (YouTube günde ~6 yüklemeye izin verir)"
        default: "6"
      sure:
        description: "Shorts: klip süresi (sn)"
        default: "30"
      secim:
        description: "Shorts: seçim türü"
        type: choice
        options: [tepki, viral]
        default: tepki
      aralik:
        description: "Sadece bu aralık (boş = tüm yayın), ör. 1:00:00-3:00:00"
        required: false
      elle:
        description: "Uzun video: elle aralıklar (Claude yoksa), ; ile ayır. Ör: 1:02:00-1:25:00 Madara Olduk"
        required: false
      cozunurluk:
        description: "Shorts çözünürlüğü (bulut işlemcisinde 4K yavaştır)"
        type: choice
        options: ["1080p", "4k"]
        default: "1080p"
      dosyalari_sakla:
        description: "Üretilen dosyaları da indirilebilir olarak sakla (3 gün)"
        type: boolean
        default: false

concurrency:
  group: kickclip-bulut
  cancel-in-progress: false

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null

      - name: Paketleri kur
        run: pip install -q -r requirements.txt

      - name: Whisper modelini önbellekten al
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Gizli ayarları hazırla
        env:
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
        run: |
          if [ -n "$YT_TOKEN" ]; then printf '%s' "$YT_TOKEN" > youtube_token.json; echo "YouTube bağlantısı hazır"; else echo "YT_TOKEN secret yok: YouTube'a yüklenmeyecek"; fi

      - name: KickClip
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KICKCLIP_MODEL: ${{ vars.KICKCLIP_MODEL }}
          KC_LINK: ${{ inputs.link }}
          KC_TUR: ${{ inputs.tur }}
          KC_YOUTUBE: ${{ inputs.youtube }}
          KC_ADET: ${{ inputs.adet }}
          KC_SURE: ${{ inputs.sure }}
          KC_SECIM: ${{ inputs.secim }}
          KC_ARALIK: ${{ inputs.aralik }}
          KC_ELLE: ${{ inputs.elle }}
          KC_COZUNURLUK: ${{ inputs.cozunurluk }}
          PYTHONUNBUFFERED: "1"
        run: python -m kickclip.cloud

      - name: Token dosyasını sil
        if: always()
        run: rm -f youtube_token.json

      - name: Dosyaları sakla
        if: ${{ inputs.dosyalari_sakla && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kickclip-cikti
          path: bulut_cikti/
          retention-days: 3
