<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KickClip</title>
<style>
  :root { --bg:#0b0d10; --panel:#14181d; --line:#232a31; --text:#e8edf2; --muted:#8a96a3; --accent:#53fc18; --err:#ff5d5d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:20px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { margin:0; font-size:20px; letter-spacing:.3px; }
  header h1 span { color:var(--accent); }
  header p { margin:0; color:var(--muted); font-size:13px; }
  main { max-width:1200px; margin:0 auto; padding:24px; display:grid; grid-template-columns:380px 1fr; gap:24px; }
  @media (max-width:900px){ main { grid-template-columns:1fr; padding:16px; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; text-transform:uppercase; letter-spacing:.5px; }
  input, select { width:100%; background:#0e1115; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 10px; font:inherit; }
  input[type=checkbox]{ width:auto; margin-right:6px; }
  input[type=color]{ padding:2px; height:38px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .check { display:flex; align-items:center; margin-top:12px; color:var(--text); text-transform:none; font-size:14px; letter-spacing:0; }
  button { margin-top:16px; width:100%; background:var(--accent); color:#071003; border:0; border-radius:8px; padding:12px; font-weight:700; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); width:auto; padding:6px 12px; margin:0; font-weight:500; font-size:13px; }
  details summary { cursor:pointer; color:var(--muted); margin-top:14px; font-size:13px; }
  .hint { color:var(--muted); font-size:12px; margin-top:4px; }
  .bar { height:8px; background:#0e1115; border-radius:99px; overflow:hidden; border:1px solid var(--line); }
  .bar > div { height:100%; background:var(--accent); width:0; transition:width .4s; }
  .status { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:10px; }
  .status b { font-size:14px; }
  pre { background:#0e1115; border:1px solid var(--line); border-radius:8px; padding:10px; height:180px; overflow:auto; font-size:12px; color:#b8c4cf; white-space:pre-wrap; margin:12px 0 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; margin-top:16px; }
  .clip { background:#0e1115; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .clip video { width:100%; aspect-ratio:9/16; display:block; background:#000; }
  .clip .meta { padding:8px 10px; font-size:12px; color:var(--muted); }
  .clip .meta b { color:var(--text); }
  .clip .meta a { color:var(--accent); text-decoration:none; float:right; }
  .clip .tx { margin-top:4px; max-height:3.6em; overflow:hidden; }
  textarea { width:100%; background:#0b0d10; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; font-size:12px; resize:vertical; }
  .clip input, .clip select { padding:6px 8px; font-size:13px; }
  .clip .ttl { font-weight:600; }
  .clip .cnt { float:right; font-size:11px; color:var(--muted); }
  .clip .acts { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .clip .acts button { flex:1; margin:0; padding:7px 6px; font-size:12px; }
  .clip .yt { margin-top:8px; font-size:12px; }
  .clip .yt a { color:#ff4e45; float:none; }
  .btn-yt { background:#ff0033 !important; color:#fff !important; }
  .banner { font-size:12px; color:var(--muted); background:#0e1115; border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-top:12px; }
  .banner b { color:var(--text); }
  h2 { font-size:15px; margin:22px 0 0; display:flex; justify-content:space-between; align-items:center; }
  .empty { color:var(--muted); text-align:center; padding:40px 0; }
  .err { color:var(--err); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Kick<span>Clip</span></h1>
    <p>Yayın linkini yapıştır → otomatik dikey klipler (kamera üstte, ekran altta, altyazı, zil + blur giriş)</p>
  </div>
</header>
<main>
  <section class="card">
    <form id="f">
      <label>Kick linki veya dosya yolu</label>
      <input name="source" placeholder="https://kick.com/kanal/videos/..." required>
      <div class="hint">Canlı yayın, VOD veya klip linki olabilir.</div>

      <div class="row">
        <div><label>Mod</label>
          <select name="mode">
            <option value="highlights">En hareketli anlar</option>
            <option value="split">Sırayla parçala</option>
          </select></div>
        <div><label>Klip sayısı</label><input name="max_clips" type="number" min="1" max="100" value="{{ d.max_clips }}"></div>
      </div>
      <div class="row">
        <div><label>Klip süresi (sn)</label><input name="clip_length" type="number" min="5" max="180" value="{{ d.clip_length|int }}"></div>
        <div><label>Zaman aralığı</label><input name="time_range" placeholder="1:00:00-2:00:00"></div>
      </div>

      <label>Yayıncı kamerası</label>
      <select name="cam">
        <option value="auto">Otomatik bul (yüz tespiti)</option>
        <option value="top-left">Sol üst köşe</option>
        <option value="top-right">Sağ üst köşe</option>
        <option value="bottom-left">Sol alt köşe</option>
        <option value="bottom-right">Sağ alt köşe</option>
        <option value="none">Kamera yok (tam ekran)</option>
        <option value="custom">Elle (x,y,w,h)</option>
      </select>
      <input name="cam_custom" placeholder="x,y,w,h  ör. 0.72,0.62,0.27,0.36" style="margin-top:6px; display:none">

      <label>Alt panel (ekran)</label>
      <select name="screen">
        <option value="crop">Ortadan kırp (tam dolu)</option>
        <option value="fit">Tamamını sığdır (bulanık arka plan)</option>
      </select>

      <label class="check"><input type="checkbox" name="subtitles" checked> Altyazı ekle</label>
      <label class="check"><input type="checkbox" name="intro" checked> Zil sesi + blur giriş</label>
      <label class="check"><input type="checkbox" name="titles" checked> YouTube Shorts başlığı üret</label>

      <details>
        <summary>Gelişmiş ayarlar</summary>
        <div class="row">
          <div><label>Whisper modeli</label>
            <select name="whisper_model">
              <option>tiny</option><option>base</option><option selected>small</option><option>medium</option><option>large-v3</option>
            </select></div>
          <div><label>Dil</label><input name="language" value="tr"></div>
        </div>
        <div class="row">
          <div><label>Yazı boyutu</label><input name="font_size" type="number" value="{{ d.font_size }}"></div>
          <div><label>Kelime / satır</label><input name="words_per_line" type="number" min="1" max="8" value="{{ d.words_per_line }}"></div>
        </div>
        <div class="row">
          <div><label>Vurgu rengi</label><input name="highlight_color" type="color" value="{{ d.highlight_color }}"></div>
          <div><label>Kamera paneli oranı</label><input name="cam_ratio" type="number" step="0.05" min="0.2" max="0.6" value="{{ d.cam_ratio }}"></div>
        </div>
        <div class="row">
          <div><label>Kamera zoom (auto)</label><input name="cam_zoom" type="number" step="0.1" value="{{ d.cam_zoom }}"></div>
          <div><label>Blur süresi (sn)</label><input name="intro_hold" type="number" step="0.05" value="{{ d.intro_hold }}"></div>
        </div>
        <label>Yayıncı adı (hashtag için, boşsa linkten)</label><input name="streamer" placeholder="ör. jahrein">
        <div class="row">
          <div><label>Zil ses seviyesi</label><input name="bell_volume" type="number" step="0.1" value="{{ d.bell_volume }}"></div>
          <div><label>Canlı kayıt (dk)</label><input name="live_minutes" type="number" value="{{ d.live_minutes|int }}"></div>
        </div>
      </details>

      <button id="go" type="submit">Klipleri üret</button>
    </form>
  </section>

  <section class="card">
    <div class="status">
      <b id="st">Hazır</b>
      <button class="ghost" id="cancel" style="display:none">Durdur</button>
    </div>
    <div class="bar"><div id="pb"></div></div>
    <pre id="log">Link yapıştırıp "Klipleri üret"e bas.</pre>
    <div class="banner" id="ytinfo"></div>
    <h2>Klipler <button class="ghost" id="refresh">Yenile</button></h2>
    <div class="grid" id="clips"><div class="empty">Henüz klip yok.</div></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const form = $('#f');
let current = null, timer = null, shown = -1;

form.cam.addEventListener('change', () => {
  form.cam_custom.style.display = form.cam.value === 'custom' ? 'block' : 'none';
});

const statusText = {queued:'Sırada', running:'Çalışıyor', done:'Tamamlandı ✓', error:'Hata', cancelled:'Durduruldu'};
const cards = {};   // key -> element (kullanıcı yazarken yeniden çizilmesin)

form.addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(form);
  const body = Object.fromEntries(fd.entries());
  for (const k of ['subtitles','intro','titles']) body[k] = form[k].checked;
  if (body.cam === 'custom') body.cam = body.cam_custom;
  delete body.cam_custom;
  $('#go').disabled = true;
  const r = await fetch('/api/jobs', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) { alert(j.error || 'Hata'); $('#go').disabled = false; return; }
  current = j.id;
  poll();
});

$('#cancel').onclick = () => current && fetch(`/api/jobs/${current}/cancel`, {method:'POST'});
$('#refresh').onclick = () => loadLibrary();

function esc(s){ return (s??'').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function poll(){
  clearTimeout(timer);
  const r = await fetch(`/api/jobs/${current}`);
  if (!r.ok) return;
  const j = await r.json();
  $('#st').textContent = statusText[j.status] || j.status;
  $('#st').className = j.status === 'error' ? 'err' : '';
  $('#pb').style.width = (j.progress*100).toFixed(1) + '%';
  const log = $('#log');
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 10;
  log.textContent = j.logs.join('\n');
  if (atBottom) log.scrollTop = log.scrollHeight;
  if (j.clips !== shown) { shown = j.clips; loadLibrary(); }
  const running = j.status === 'queued' || j.status === 'running';
  $('#cancel').style.display = running ? '' : 'none';
  $('#go').disabled = running;
  if (running) timer = setTimeout(poll, 1500); else loadLibrary();
}

async function ytInfo(){
  const s = await (await fetch('/api/youtube/status')).json();
  const parts = [];
  parts.push(s.authorized ? '✅ <b>YouTube bağlı</b>'
    : s.client_secret ? '🔑 <b>YouTube:</b> ilk yüklemede tarayıcıda Google izni istenecek'
    : '⚠️ <b>YouTube bağlı değil:</b> proje klasörüne <b>client_secret.json</b> koy (README → YouTube kurulumu)');
  parts.push(s.claude_titles ? '✨ Başlıklar <b>Claude</b> ile üretiliyor' : 'ℹ️ Daha iyi başlıklar için <b>ANTHROPIC_API_KEY</b> tanımla (şu an basit başlık)');
  $('#ytinfo').innerHTML = parts.join('<br>');
}

function ytHtml(c){
  if (c.upload && c.upload.status === 'running') return `⏳ Yükleniyor... ${esc((c.upload.log||[]).slice(-1)[0]||'')}`;
  if (c.upload && c.upload.status === 'error') return `<span class="err">❌ ${esc(c.upload.error)}</span>`;
  if (c.youtube) return `✅ <a href="${esc(c.youtube.url)}" target="_blank">${esc(c.youtube.url)}</a> (${esc(c.youtube.privacy)}${c.youtube.publish_at ? ', ' + esc(c.youtube.publish_at) : ''})`;
  return '';
}

function makeCard(c){
  const el = document.createElement('div');
  el.className = 'clip';
  el.innerHTML = `<video controls preload="metadata" ${c.thumb?`poster="${c.thumb}"`:''} src="${c.video}"></video>
    <div class="meta">
      <b>${esc(c.name)}</b> · ${esc(c.start_hms)} <a href="${c.video}?dl=1">İndir ↓</a>
      <label>Başlık <span class="cnt"></span></label>
      <input class="ttl" maxlength="100" value="${esc(c.title)}">
      <label>Açıklama</label>
      <textarea class="desc" rows="3">${esc(c.description)}</textarea>
      <label>Etiketler (virgülle)</label>
      <input class="tags" value="${esc((c.tags||[]).join(', '))}">
      <div class="row" style="margin-top:6px">
        <select class="priv"><option value="public">Herkese açık</option><option value="unlisted">Liste dışı</option><option value="private">Özel</option></select>
        <input class="sched" type="datetime-local" title="Zamanla (boş = hemen)">
      </div>
      <div class="acts">
        <button class="ghost re">✨ Yeni başlık</button>
        <button class="ghost save">Kaydet</button>
        <button class="up btn-yt">YouTube'a yükle</button>
      </div>
      <div class="yt"></div>
      <details><summary>Konuşma metni</summary><div class="tx" style="max-height:none">${esc(c.transcript)}</div></details>
    </div>`;
  const q = s => el.querySelector(s);
  const count = () => q('.cnt').textContent = `${q('.ttl').value.length}/100`;
  q('.ttl').addEventListener('input', count); count();
  const fields = () => ({title:q('.ttl').value, description:q('.desc').value, tags:q('.tags').value});
  const url = `/api/clips/${encodeURIComponent(c.run)}/${encodeURIComponent(c.name)}`;
  q('.save').onclick = async () => {
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(fields())});
    q('.save').textContent = r.ok ? 'Kaydedildi ✓' : 'Hata'; setTimeout(() => q('.save').textContent = 'Kaydet', 1500);
  };
  q('.re').onclick = async () => {
    q('.re').disabled = true; q('.re').textContent = 'Üretiliyor...';
    const r = await fetch(url + '/retitle', {method:'POST'});
    if (r.ok) { const n = await r.json(); q('.ttl').value = n.title; q('.desc').value = n.description; q('.tags').value = (n.tags||[]).join(', '); count(); }
    q('.re').disabled = false; q('.re').textContent = '✨ Yeni başlık';
  };
  q('.up').onclick = async () => {
    const sched = q('.sched').value;
    const body = {...fields(), privacy:q('.priv').value, publish_at: sched ? new Date(sched).toISOString() : ''};
    if (el._yt && !confirm('Bu klip zaten yüklendi. Tekrar yüklensin mi?')) return;
    if (el._yt) body.force = true;
    q('.up').disabled = true;
    const r = await fetch(url + '/upload', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const j = await r.json();
    if (!r.ok) { alert(j.error || 'Hata'); q('.up').disabled = false; return; }
    q('.yt').textContent = '⏳ Yükleniyor...';
    watchUploads();
  };
  return el;
}

function updateCard(el, c){
  el._yt = !!c.youtube;
  el.querySelector('.yt').innerHTML = ytHtml(c);
  const up = el.querySelector('.up');
  const running = c.upload && c.upload.status === 'running';
  up.disabled = running;
  up.textContent = c.youtube ? 'Tekrar yükle' : "YouTube'a yükle";
  return running;
}

let upTimer = null;
async function loadLibrary(){
  const list = await (await fetch('/api/library')).json();
  const grid = $('#clips');
  if (!list.length) { grid.innerHTML = '<div class="empty">Henüz klip yok.</div>'; return false; }
  grid.querySelector('.empty')?.remove();
  let anyRunning = false;
  let prev = null;
  for (const c of list) {
    let el = cards[c.key];
    if (!el) { el = cards[c.key] = makeCard(c); }
    if (prev ? prev.nextSibling !== el : grid.firstChild !== el) {
      prev ? prev.after(el) : grid.prepend(el);
    }
    prev = el;
    anyRunning = updateCard(el, c) || anyRunning;
  }
  return anyRunning;
}
async function watchUploads(){
  clearTimeout(upTimer);
  if (await loadLibrary()) upTimer = setTimeout(watchUploads, 2000);
  else ytInfo();
}

ytInfo();
watchUploads();
</script>
</body>
</html>
